version: '3.8'

services:
  # Unified Backend & Python AI Worker
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infra-xray-api
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      # Mount data volume so uploaded documents and generated reports persist across restarts
      - ./data:/app/data
    restart: unless-stopped
